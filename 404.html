<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>الصفحة غير موجودة</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0f0f1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Tajawal', 'Segoe UI', sans-serif;
            text-align: center;
            padding: 20px;
        }
        .error-container {
            max-width: 500px;
            padding: 40px 20px;
        }
        .error-container .icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        .error-container h1 {
            color: #e74c3c;
            font-size: 36px;
            font-weight: 900;
            margin-bottom: 10px;
        }
        .error-container p {
            color: #888;
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 20px;
        }
        .error-container .btn {
            display: inline-block;
            padding: 12px 30px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            transition: 0.3s;
            font-family: 'Tajawal', 'Segoe UI', sans-serif;
        }
        .error-container .btn:hover {
            background: #2980b9;
            transform: scale(1.05);
        }
        .error-container .glow {
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(52, 152, 219, 0.05), transparent 70%);
            top: -150px;
            right: -150px;
            pointer-events: none;
            z-index: -1;
        }
        .error-container .glow2 {
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(231, 76, 60, 0.04), transparent 70%);
            bottom: -100px;
            left: -100px;
            pointer-events: none;
            z-index: -1;
        }
    </style>
</head>
<body>

    <div class="glow"></div>
    <div class="glow2"></div>

    <div class="error-container">
        <div class="icon">🔒</div>
        <h1>⛔ الصفحة غير متاحة</h1>
        <p>
            الصفحة التي تبحث عنها غير موجودة أو تم حذفها.<br>
            يرجى العودة إلى الصفحة الرئيسية.
        </p>
        <a href="/" class="btn">🏠 العودة للرئيسية</a>
        <p style="margin-top: 20px; font-size: 12px; color: #555;">
            Error 404 · تم حماية المحتوى
        </p>
    </div>

    <!-- ===== حماية إضافية ===== -->
    <script>
        // منع F12
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12' || e.keyCode === 123) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }
            if (e.ctrlKey && (e.key === 'u' || e.key === 'U')) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }
            if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }
            return true;
        }, true);

        // منع النقر بزر اليمين
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        });

        // منع dragging
        document.addEventListener('dragstart', function(e) {
            e.preventDefault();
            return false;
        });

        // منع النسخ
        document.addEventListener('copy', function(e) {
            e.preventDefault();
            return false;
        });

        // منع view-source
        if (window.location.href.includes('view-source:')) {
            window.location.href = window.location.href.replace('view-source:', '');
        }

        console.log('🔒 هذه الصفحة محمية');
    </script>

</body>
</html>
