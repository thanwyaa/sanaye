<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>جاري التحميل...</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0f0f1a;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:sans-serif;text-align:center}
        .loader{width:60px;height:60px;border:4px solid rgba(255,255,255,.08);border-top:4px solid #3498db;border-radius:50%;animation:spin 1s linear infinite;margin:20px auto}
        .progress{width:200px;height:4px;background:rgba(255,255,255,.08);border-radius:4px;margin:0 auto;overflow:hidden}
        .progress .fill{height:100%;width:0%;background:linear-gradient(90deg,#2ecc71,#3498db);animation:load 2.5s forwards}
        @keyframes spin{to{transform:rotate(360deg)}}
        @keyframes load{0%{width:0%}100%{width:100%}}
        .logo{width:100px;height:100px;border-radius:50%;object-fit:cover;border:4px solid rgba(255,255,255,.15);margin-bottom:16px}
        h1{color:#fff;font-size:24px;background:linear-gradient(45deg,#2ecc71,#3498db);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .sub{color:rgba(255,255,255,.3);font-size:13px;margin:4px 0 10px}
        .status{color:rgba(255,255,255,.2);font-size:11px;margin-top:12px}
    </style>
    <script>
        // ===== منع view-source =====
        if (window.location.href.includes('view-source:')) {
            window.location.href = window.location.href.replace('view-source:', '');
        }
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12' || e.keyCode === 123) {
                e.preventDefault();
                return false;
            }
            if (e.ctrlKey && (e.key === 'u' || e.key === 'U')) {
                e.preventDefault();
                return false;
            }
            if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j')) {
                e.preventDefault();
                return false;
            }
            return true;
        });
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        });
        console.log = function() {};
        console.warn = function() {};
        console.error = function() {};
        console.info = function() {};

        // ===== التوجيه للمنصة =====
        var msgs = ['جاري تجهيز المنصة...', 'تحميل المكتبة...', 'تجهيز المنتدى...', 'تم التحميل!'];
        var i = 0;
        var statusEl = document.getElementById('s');
        function up() {
            if (i < msgs.length) {
                statusEl.textContent = msgs[i];
                i++;
                setTimeout(up, 600);
            } else {
                statusEl.textContent = '✅ جاري فتح المنصة...';
                setTimeout(function() {
                    window.location.href = 'app.html';
                }, 1000);
            }
        }
        setTimeout(up, 300);
    </script>
</head>
<body>
<div>
    <img src="icon-512.jpg" class="logo">
    <h1>الثانوية الرسمية بلس</h1>
    <div class="sub">معاك طول المشوار</div>
    <div class="loader"></div>
    <div class="progress"><div class="fill"></div></div>
    <div class="status" id="s">جاري تجهيز المنصة...</div>
</div>
</body>
</html>
